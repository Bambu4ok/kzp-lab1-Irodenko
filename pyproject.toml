[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kzp-lab07"
version = "0.2.0"
description = "Лабораторна робота 7: об'єктно-орієнтована обробка комунальних показників (Варіант 9)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6.0", "build>=1.2.0"]

[project.scripts]
kzp-lab06 = "kzp_lab06.cli:main"
kzp-lab07 = "kzp_lab07.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
